name: ci

on:
  push:
  pull_request:

jobs:
  fast:
    name: fast (not slow) + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Fast tests
        run: pytest -m "not slow" --cov --cov-report=term-missing
      - name: Coverage src 80%
        run: coverage report --fail-under=80
      - name: Coverage risk
        run: coverage report --include='*/risk/*' --fail-under=95
      - name: Coverage models
        run: coverage report --include='*/models/*' --fail-under=95

  blocking:
    name: merge gate (category 2/3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Blocking tests
        run: pytest -m blocking

  slow:
    name: slow simulations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Slow tests
        run: pytest -m slow
