# EGARCH / mean-equation parameters. Consumed only via src/models/schema.py ([C2]).

seed: 7

transform:
  percent_scale: 100.0
  invert_sign: true

mean:
  acf_lags: 10
  ljung_box_lags: 10
  ljung_box_pvalue_min: 0.05
  rho1_matrix_pricing_threshold: 0.15
  variance_ratio_horizons: [2, 5, 10]
  ar_lags: 1
  ma_lags: 1

variance:
  vol: EGARCH
  p: 1
  o: 1
  q: 1
  rescale: false
  ftol: 1.0e-6
  maxiter: 2000
  half_life_mass: 0.5
  stationarity_abs_beta_max: 1.0
  typical_beta_min: 0.95
  typical_beta_max: 0.99
  significance_level: 0.05
  expected_egarch_gamma_sign: -1

distribution:
  candidates: [t, skewt]
  selection_ic: bic
  forbidden: [normal, Normal]
  nu_fourth_moment_min: 4.0
  nu_normal_collapse: 20.0

forecast:
  horizons: [1, 5, 10, 22]
  method: simulation
  simulations: 10000
  reindex: false

sign_test:
  tail_percentile: 10.0
  min_tail_observations: 20

min_observations: 1000

oas_universe:
  BAMLH0A0HYM2:
    label: HY
    quality_rank: 4
  BAMLC0A0CM:
    label: IG
    quality_rank: 1
  BAMLC0A4CBBB:
    label: BBB
    quality_rank: 2
  BAMLH0A3HYC:
    label: CCC
    quality_rank: 5
  BAMLEMCBPIOAS:
    label: EM
    quality_rank: 3

plot:
  output_directory: data/output/egarch
  dpi: 120
  figsize_width: 11.0
  figsize_height: 6.0
  filename_template: "{series_id}_conditional_vol.png"

output:
  comparative_table: data/output/egarch/oas_panel_params.csv

ebp:
  invert_sign: true
  min_observations: 120
  stationarity:
    adf_pvalue_max: 0.05
    kpss_pvalue_min: 0.05
    adf_regression: c
    kpss_regression: c
    adf_maxlag: 12
  variance:
    vol: GARCH
    p: 1
    o: 1
    q: 1
    rescale: false
    ftol: 1.0e-6
    maxiter: 2000
    half_life_mass: 0.5
    significance_level: 0.05
    expected_gjr_gamma_sign: 1
    stationarity_alpha_half_gamma_beta_max: 1.0
  distribution:
    candidates: [t]
    selection_ic: bic
    forbidden: [normal, Normal]
    nu_fourth_moment_min: 4.0
    nu_normal_collapse: 20.0
  mean:
    acf_lags: 10
    ljung_box_lags: 10
    ljung_box_pvalue_min: 0.05
    rho1_matrix_pricing_threshold: 0.15
    variance_ratio_horizons: [2, 5]
    ar_lags: 1
    ma_lags: 1
  forecast:
    horizons: [1, 3, 6, 12]
    method: simulation
    simulations: 5000
    reindex: false
  sign_test:
    tail_percentile: 10.0
    min_tail_observations: 12
  disaggregation:
    method: chow_lin
    fallback: denton_cholette
    include_constant: true
    rho_grid_min: -0.99
    rho_grid_max: 0.99
    rho_grid_size: 199
    condition_number_max: 1.0e12
    consistency_atol: 1.0e-10
    high_freq_rho_from_monthly: true
  signal:
    primary_frequency: monthly
    daily_may_originate: false
    robustness_min_correlation: 0.70
  plot:
    output_directory: data/output/ebp
    dpi: 120
    figsize_width: 11.0
    figsize_height: 6.0
    filename_template: "ebp_comparative_{layer}.png"
  output:
    comparative_table: data/output/ebp/comparative_signals.csv
